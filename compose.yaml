x-workspace-volumes: &workspace-volumes
  - .:/app
  - app_node_modules:/app/node_modules
  - api_node_modules:/app/apps/api/node_modules
  - web_node_modules:/app/apps/web/node_modules
  - shared_node_modules:/app/packages/shared/node_modules

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aiworld}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aiworld}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  shared:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
    command:
      - pnpm
      - --filter
      - "@aiworld/shared"
      - dev
    volumes: *workspace-volumes
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:fs').accessSync('/app/packages/shared/dist/config/ports.js')",
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12

  api:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
    command:
      - sh
      - -c
      - >-
        pnpm --filter @aiworld/api db:generate
        && pnpm --filter @aiworld/api db:migrate:deploy
        && pnpm --filter @aiworld/api db:seed:if-empty
        && pnpm --filter @aiworld/api dev
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    volumes: *workspace-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      shared:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.API_PORT || '3000'; fetch('http://127.0.0.1:' + port + '/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  web:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      API_HOST: api
      API_PORT: ${API_PORT:-3000}
      WEB_PORT: ${WEB_PORT:-5173}
      API_PROXY_TARGET: http://api:${API_PORT:-3000}
    command:
      - pnpm
      - --filter
      - "@aiworld/web"
      - dev:docker
      - --host
      - 0.0.0.0
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    volumes: *workspace-volumes
    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.WEB_PORT || '5173'; fetch('http://127.0.0.1:' + port + '/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
volumes:
  app_node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  pgdata:
